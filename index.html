<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#071b1c">
<title>QUOKA 스쿱마켓</title>
<link rel="preload" as="image" href="assets/pack.webp">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.min.css">
<style>
@property --hover{syntax:'<number>';inherits:true;initial-value:0}
@property --mx{syntax:'<number>';inherits:true;initial-value:50}
@property --my{syntax:'<number>';inherits:true;initial-value:50}
@property --ang{syntax:'<angle>';inherits:false;initial-value:0deg}
:root{
  --bg-0:#061718; --bg-1:#0b2a2b; --bg-2:#123f3d;
  --gold:#f6d48b; --gold-2:#ffeec2; --ink:#f3f7f2; --muted:#9fb9b4; --line:#ffffff1f;
  --glass:#ffffff12; --glass-2:#ffffff1c;
  --pw:280px; --ph:476px; --cw:320px; --ch:447px;
  --cut:7.8%;
  --tabs-h:76px;
  color-scheme:dark;
  --ease-out:cubic-bezier(.16,.84,.3,1);
  --spring:cubic-bezier(.34,1.56,.64,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{
  font-family:Pretendard,"Pretendard Variable","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color:var(--ink);background:var(--bg-0);
  -webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;
}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
img{-webkit-user-drag:none}

/* ---------- backdrop ---------- */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(60% 45% at 50% 46%,#1f5a55 0%,#123f3d 38%,transparent 72%),
    radial-gradient(120% 80% at 50% 120%,#0c3433 0%,transparent 60%),
    linear-gradient(180deg,#061718 0%,#0a2627 55%,#061718 100%);}
.bg::before{content:"";position:absolute;left:50%;top:46%;width:min(120vw,900px);aspect-ratio:1;translate:-50% -50%;
  background:radial-gradient(circle,#ffd98a40 0%,#ffd98a14 30%,transparent 62%);
  transition:opacity .8s,scale .8s;}
.bg::after{content:"";position:absolute;inset:0;opacity:.35;
  background-image:radial-gradient(#ffffff22 1px,transparent 1.2px);background-size:22px 22px;
  mask-image:radial-gradient(70% 60% at 50% 45%,#000 0%,transparent 80%)}
body[data-scene="reveal"] .bg::before{scale:1.25;opacity:1}
#fx{position:fixed;inset:0;z-index:40;pointer-events:none;width:100%;height:100%}

/* ---------- shell ---------- */
.app{position:relative;z-index:1;height:100dvh;max-width:560px;margin:0 auto;display:grid;grid-template-rows:auto 1fr auto;
  padding:env(safe-area-inset-top) 0 calc(var(--tabs-h) + env(safe-area-inset-bottom));transition:padding .4s var(--ease-out)}
body[data-scene="opening"] .app,body[data-scene="reveal"] .app{padding-bottom:env(safe-area-inset-bottom)}
.top{height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;gap:10px;transition:opacity .4s}
.logo{display:flex;flex-direction:column;line-height:1}
.logo b{font-weight:900;letter-spacing:.24em;font-size:17px;color:var(--gold-2)}
.logo span{font-size:9.5px;letter-spacing:.22em;color:var(--muted);margin-top:4px}
.top-actions{display:flex;gap:8px;align-items:center}
.chip-btn{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);
  background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-size:13px;font-weight:600;transition:background .2s,transform .2s}
.chip-btn:hover{background:var(--glass-2)}
.chip-btn:active{transform:scale(.96)}
.chip-btn svg{width:17px;height:17px}
.chip-btn .count{color:var(--gold);font-variant-numeric:tabular-nums}
.icon-btn{width:38px;padding:0;justify-content:center}
body[data-scene="opening"] .top,body[data-scene="reveal"] .top{opacity:0;pointer-events:none}

.stage{position:relative;min-height:0;overflow:visible}
.foot{min-height:118px;padding:6px 20px 18px;display:grid;place-items:center;text-align:center;position:relative}
.foot>section{grid-area:1/1;display:flex;flex-direction:column;align-items:center;gap:8px;transition:opacity .35s,translate .35s}
.foot>section:not(.on){opacity:0;translate:0 8px;pointer-events:none}
.hint{font-size:15px;font-weight:600;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.hint .arrows{display:inline-block;color:var(--gold);animation:nudge 1.6s ease-in-out infinite}
@keyframes nudge{0%,100%{translate:-3px 0}50%{translate:3px 0}}
.sub{font-size:12.5px;color:var(--muted)}
.counter{font-size:13px;font-weight:700;letter-spacing:.08em;color:var(--gold);font-variant-numeric:tabular-nums}
.pips{display:flex;gap:6px}
.pips i{width:6px;height:6px;border-radius:50%;background:#ffffff2e;transition:background .3s,width .3s}
.pips i.done{background:#ffffff70}
.pips i.cur{background:var(--gold);width:18px;border-radius:4px}
.text-btn{background:none;border:0;padding:8px 12px;font-size:13px;color:var(--muted);text-decoration:underline;text-underline-offset:4px}

/* ---------- pack ---------- */
.pack-wrap{position:absolute;left:50%;top:50%;width:var(--pw);height:var(--ph);margin:calc(var(--ph)/-2) 0 0 calc(var(--pw)/-2);z-index:3;perspective:1000px}
.pack-float{width:100%;height:100%;animation:float 4.2s ease-in-out infinite}
@keyframes float{0%,100%{translate:0 -5px}50%{translate:0 7px}}
.pack{position:relative;width:100%;height:100%;transform-style:preserve-3d;--rx:0deg;--ry:0deg;--sx:50%;
  transform:rotateX(var(--rx)) rotateY(var(--ry));transition:transform .5s var(--ease-out);touch-action:none;cursor:grab}
.pack.live{transition:none}
.pack::before{content:"";position:absolute;left:10%;right:10%;bottom:-6%;height:7%;border-radius:50%;background:#000;filter:blur(14px);opacity:.55;transform:translateZ(-30px)}
.pack-part{position:absolute;inset:0;background:url(assets/pack.webp) center/100% 100% no-repeat}
.pack-cap{transform-origin:var(--peel-origin,100%) var(--cut);will-change:transform}
.sheen{position:absolute;inset:.4% 8% .6%;border-radius:2%;pointer-events:none;mix-blend-mode:overlay;
  background:linear-gradient(105deg,#fff0 calc(var(--sx) - 26%),#ffffff90 calc(var(--sx) - 4%),#ffffffd0 var(--sx),#ffffff80 calc(var(--sx) + 5%),#fff0 calc(var(--sx) + 28%));opacity:.75}
.sheen.rainbow{mix-blend-mode:color-dodge;opacity:.22;
  background:linear-gradient(115deg,#ff9bd2 calc(var(--sx) - 40%),#9fd4ff calc(var(--sx) - 15%),#9fffd8 var(--sx),#fff59b calc(var(--sx) + 15%),#ffb69b calc(var(--sx) + 40%))}
.cut-guide{position:absolute;left:7%;right:7%;top:var(--cut);height:0;border-top:2px dashed #ffffffb0;translate:0 -1px;filter:drop-shadow(0 0 4px #ffffff90);transition:opacity .3s}
.cut-guide::after{content:"";position:absolute;top:-8px;left:0;width:14px;height:14px;border-radius:50%;
  background:radial-gradient(circle,#fff 0 30%,#ffe7a8 45%,#ffe7a800 72%);box-shadow:0 0 18px 6px #fff4c870;animation:guide 2.2s cubic-bezier(.45,0,.3,1) infinite}
@keyframes guide{0%{left:-4%;opacity:0}12%{opacity:1}78%{opacity:1}100%{left:100%;opacity:0}}
.cut-glow{position:absolute;top:var(--cut);height:3px;left:0;width:0;translate:0 -1.5px;border-radius:3px;background:#fff;
  box-shadow:0 0 6px 2px #fff,0 0 16px 4px #ffe6a6,0 0 34px 8px #9fe3ff80;opacity:0;pointer-events:none}
.cut-spark{position:absolute;top:var(--cut);width:30px;height:30px;margin:-15px 0 0 -15px;left:0;border-radius:50%;pointer-events:none;opacity:0;
  background:radial-gradient(circle,#fff 0 18%,#fff2c4 32%,#ffe0a000 70%)}
.mouth{position:absolute;left:6%;right:6%;top:var(--cut);height:4px;translate:0 -2px;border-radius:50%;background:#fff;opacity:0;pointer-events:none;
  box-shadow:0 0 10px 4px #fff,0 0 40px 16px #fff2c8,0 0 90px 40px #9fe3ff70}
.tear-key{position:absolute;left:0;right:0;top:0;height:18%;opacity:0;border:0;background:none}
.tear-key:focus-visible{opacity:1;outline:2px solid var(--gold);border-radius:12px}
.pack-wrap.tearing .cut-guide,.pack-wrap.gone .cut-guide{opacity:0}
.pack-wrap.gone .pack-float{animation:none}

/* ---------- card ---------- */
.card{position:relative;width:100%;aspect-ratio:1061/1482;border-radius:4.4%/3.15%;overflow:hidden;background:#0c2b2a;
  --mx:50;--my:50;--hover:0;isolation:isolate;
  box-shadow:0 1px 0 #ffffff30 inset,0 24px 50px -18px #000c,0 8px 18px -8px #0008}
.card img{display:block;width:100%;height:100%;object-fit:cover;pointer-events:none}
.card i{position:absolute;inset:0;pointer-events:none;border-radius:inherit}
.card .foil{mix-blend-mode:color-dodge;opacity:calc(.08 + var(--hover)*.32);
  background:repeating-linear-gradient(115deg,#ff7ac600 0%,#ff9bd2 5%,#9fd4ff 10%,#9fffd8 15%,#fff59b 20%,#ffb69b 25%,#ff7ac600 30%);
  background-size:400% 400%;background-position:calc(var(--mx)*1%) calc(var(--my)*1%);
  -webkit-mask:radial-gradient(85% 70% at 50% 45%,#0007 40%,#000 85%);mask:radial-gradient(85% 70% at 50% 45%,#0007 40%,#000 85%)}
.card .glare{mix-blend-mode:overlay;opacity:calc(var(--hover)*.9);
  background:radial-gradient(farthest-corner circle at calc(var(--mx)*1%) calc(var(--my)*1%),#ffffffd0 0%,#ffffff50 22%,#0000 45%,#00000040 100%)}
.card .sweep{mix-blend-mode:overlay;opacity:0;
  background:linear-gradient(105deg,#fff0 30%,#ffffffd0 46%,#fff 50%,#ffffffd0 54%,#fff0 70%);background-size:250% 100%}
.card .edge{box-shadow:inset 0 0 0 1px #ffffff40}

/* ---------- immersive rarity ---------- */
.card .imm-ring{padding:2.5px;background:conic-gradient(from var(--ang),#ff9bd2,#c6b8ff,#9fd4ff,#9fffd8,#fff59b,#ffb69b,#ff9bd2);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude;
  animation:ang 3.2s linear infinite;opacity:.95}
.card:not(.is-imm) .imm-ring{display:none}
@keyframes ang{to{--ang:360deg}}
.card.is-imm{box-shadow:0 0 0 1px #ffffff40,0 0 32px -4px #c6b8ffa0,0 24px 50px -18px #000c}
.imm-chip{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:900;letter-spacing:.14em;padding:4px 10px;border-radius:999px;
  color:#1d1240;background:linear-gradient(110deg,#ffc3e6,#c6b8ff,#9fe3ff,#b8ffd9);box-shadow:0 0 18px #c6b8ff80}

.imm{position:fixed;inset:0;z-index:35;display:none;cursor:pointer;touch-action:none}
.imm.on{display:block}
.imm-bg{position:absolute;inset:0;background:#000;opacity:0}
.imm-clip{position:absolute;inset:0;overflow:hidden}
.imm-back{position:absolute;inset:-6%;width:112%;height:112%;object-fit:cover;filter:blur(28px) saturate(1.2) brightness(.85);opacity:0}
.imm-media{position:absolute;inset:0;transform-origin:50% 50%;will-change:transform}
.imm-cam{position:absolute;inset:0;transform-origin:50% 45%}
.imm img,.imm video{max-width:none}
.imm-cam img,.imm-cam video{position:absolute;left:50%;top:50%;width:var(--fw);height:var(--fh);margin:calc(var(--fh)/-2) 0 0 calc(var(--fw)/-2);object-fit:cover;display:block}
.imm-card{position:absolute;object-fit:cover;border-radius:4.4%/3.15%;pointer-events:none}
.imm-light{position:absolute;inset:0;pointer-events:none;opacity:0;mix-blend-mode:screen;
  background:radial-gradient(60% 40% at 30% 20%,#fff2c860,transparent 70%),radial-gradient(50% 35% at 75% 70%,#c6b8ff40,transparent 70%)}
.imm-vig{position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(120% 90% at 50% 45%,transparent 55%,#000a 100%)}
.imm-ui{position:absolute;left:0;right:0;bottom:0;padding:40px 20px calc(22px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:flex-end;gap:16px;
  opacity:0;transition:opacity .4s;background:linear-gradient(transparent,#000b);pointer-events:none}
.imm-ui.show{opacity:1}
.imm-title{min-width:0}
.imm-title b{display:block;margin-top:8px;font-size:21px;font-weight:900;letter-spacing:-.02em;line-height:1.25;white-space:pre-line;text-shadow:0 2px 12px #000a}
.imm-skip{font-size:12.5px;color:#fffc;white-space:nowrap}
.imm-note{position:absolute;top:calc(14px + env(safe-area-inset-top));left:50%;translate:-50% 0;font-size:11px;color:#fffc;background:#0007;padding:6px 12px;border-radius:99px;white-space:nowrap;opacity:0;transition:opacity .4s}
.imm-ui.show~.imm-note:not([hidden]){opacity:1}
.imm-video{transition:opacity .25s}
.imm-load{position:absolute;left:50%;top:50%;translate:-50% -50%;display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;color:#fffd;background:#0008;padding:10px 16px;border-radius:99px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.imm-load[hidden]{display:none}
.imm-load i{width:16px;height:16px;border-radius:50%;border:2px solid #fff4;border-top-color:#fff;animation:spin .8s linear infinite}

/* ---------- deck (reveal) ---------- */
.rays{position:absolute;left:50%;top:50%;width:calc(var(--cw)*3.2);aspect-ratio:1;translate:-50% -50%;z-index:1;opacity:0;pointer-events:none;
  background:repeating-conic-gradient(from 0deg,#fff3c800 0deg 7deg,#fff3c826 9deg 11deg,#fff3c800 13deg 20deg);
  -webkit-mask:radial-gradient(circle,#000 0%,#0008 28%,transparent 60%);mask:radial-gradient(circle,#000 0%,#0008 28%,transparent 60%);
  animation:spin 40s linear infinite}
@keyframes spin{to{rotate:360deg}}
.deck{position:absolute;left:50%;top:50%;width:var(--cw);height:var(--ch);margin:calc(var(--ch)/-2) 0 0 calc(var(--cw)/-2);z-index:2;visibility:hidden}
.deck .rc{position:absolute;inset:0;--d:0;transform:translateY(calc(var(--d)*11px)) scale(calc(1 - var(--d)*.045));
  transition:transform .45s var(--ease-out),opacity .45s,filter .45s;touch-action:none;cursor:grab;
  filter:brightness(calc(1 - var(--d)*.18))}
.deck .rc[data-d="3"],.deck .rc[data-d="4"],.deck .rc[data-d="5"],.deck .rc[data-d="6"],.deck .rc[data-d="7"]{opacity:0}
.deck .rc.dragging{transition:none;cursor:grabbing}
.deck .rc.flying{transition:none;pointer-events:none}
.new-tag{position:absolute;left:50%;top:calc(50% - var(--ch)/2 - 16px);translate:-50% -100%;z-index:5;pointer-events:none;
  display:flex;align-items:center;gap:8px;opacity:0;transition:opacity .25s,translate .35s var(--spring)}
.new-tag.show{opacity:1;translate:-50% calc(-100% - 2px)}
.new-tag b{font-size:11px;font-weight:900;letter-spacing:.14em;color:#3a2600;padding:4px 9px;border-radius:999px;background:linear-gradient(135deg,#ffeec2,#f6c25b);box-shadow:0 0 18px #f6c25b80}
.new-tag span{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap}
.press-hint{font-size:13px;font-weight:600;color:var(--gold-2);text-align:center;padding:4px 0 0;animation:breathe 2.4s ease-in-out infinite}
.press-hint[hidden]{display:none}
#revealHint.special{color:var(--gold-2);font-weight:600;animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}
.sr-btn:not(:focus-visible){position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.flash{position:fixed;inset:0;z-index:30;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 45%,#fff 0%,#fffbe9 30%,#fff3d000 75%)}

/* ---------- sheets ---------- */
.sheet{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;opacity:0;visibility:hidden;transition:opacity .35s,visibility 0s .35s}
.sheet.open{opacity:1;visibility:visible;transition:opacity .35s}
.sheet .scrim{position:absolute;inset:0;background:#041213e6;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.sheet .inner{position:relative;width:100%;max-width:560px;margin:0 auto;height:100%;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.sheet-head{display:flex;align-items:center;gap:12px;padding:14px 18px 6px;min-height:60px}
.sheet-head h2{margin:0;font-size:19px;font-weight:800;letter-spacing:-.02em;flex:1}
.scroll{flex:1;overflow:auto;padding:6px 18px 24px;-webkit-overflow-scrolling:touch}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:420px){.grid{gap:9px}}
.tile{position:relative;padding:0;border:0;background:none;border-radius:8%/5.7%;transition:transform .25s var(--spring)}
.tile:active{transform:scale(.95)}
.tile .card{box-shadow:0 10px 22px -10px #000c}
.tile .badge{position:absolute;top:5px;right:5px;z-index:2;font-size:9.5px;font-weight:900;letter-spacing:.08em;padding:3px 6px;border-radius:999px;
  color:#3a2600;background:linear-gradient(135deg,#ffeec2,#f6c25b);box-shadow:0 2px 10px #0006}
.tile-title{margin-top:7px;font-size:11px;line-height:1.3;color:#d6e3df;text-align:center;word-break:keep-all;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

.result-hero{text-align:center;padding:4px 18px 16px}
.result-hero .eyebrow{font-size:11px;letter-spacing:.24em;color:var(--gold);font-weight:700}
.result-hero h2{margin:6px 0 4px;font-size:26px;font-weight:900;letter-spacing:-.03em}
.result-hero p{margin:0;color:var(--muted);font-size:13.5px}
.actions{display:flex;gap:10px;padding:12px 18px 18px}
.btn{flex:1;height:52px;border-radius:16px;border:1px solid var(--line);background:var(--glass);font-size:15px;font-weight:700;transition:transform .2s,filter .2s}
.btn:active{transform:scale(.97)}
.btn.primary{border:0;color:#2c1d00;background:linear-gradient(135deg,#ffeec2 0%,#f6d48b 45%,#e9b456 100%);box-shadow:0 10px 30px -10px #f6c25b90,inset 0 1px 0 #fff8}
.btn.primary:hover{filter:brightness(1.05)}

/* ---------- my cards: carousel ---------- */
.viewer .inner{align-items:center}
.viewer .sheet-head{width:100%}
.v-count{font-size:13px;font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums;padding-right:4px}
.car{position:relative;flex:1;min-height:0;width:100%;overflow:hidden;touch-action:none;perspective:1400px;cursor:grab;outline:none}
.car.dragging{cursor:grabbing}
.car-track{position:absolute;inset:0}
.slide{position:absolute;left:50%;top:50%;width:var(--vw,300px);margin:calc(var(--vw,300px)*-0.6983) 0 0 calc(var(--vw,300px)/-2);perspective:1200px;
  transition:transform .55s var(--ease-out),opacity .45s,filter .45s}
.car.dragging .slide{transition:none}
.slide .tilt{transform-style:preserve-3d;transition:transform .5s var(--ease-out)}
.slide .tilt.live{transition:none}
.slide .flip{position:relative;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.3,1.25,.5,1)}
.slide .flip.flipped{transform:rotateY(180deg)}
.slide .flip>.card{backface-visibility:hidden;-webkit-backface-visibility:hidden}
.card.locked-face{background:#062a27 url(assets/card-back.webp) center/100% 100% no-repeat;container-type:inline-size}
.card.locked-face::before{content:"";position:absolute;inset:0;background:radial-gradient(70% 50% at 50% 33%,#0000 0%,#041a18b0 70%),#041a1890;backdrop-filter:grayscale(.6)}
.locked-face .lk{position:absolute;left:0;right:0;top:58%;text-align:center;color:#e9dfbf}
.locked-face .lk b{display:block;font-size:12cqw;font-weight:900;line-height:1;color:#f6e6b9a0}
.locked-face .lk span{display:block;margin-top:3cqw;font-size:4.2cqw;font-weight:600;color:#cbbd8fd0}
.locked-face .lk small{display:block;margin-top:2cqw;font-size:3cqw;letter-spacing:.3cqw;color:#cbbd8f90}
.view-toggle{display:flex;padding:3px;border-radius:999px;background:var(--glass);border:1px solid var(--line);flex:none}
.view-toggle button{width:40px;height:32px;border:0;border-radius:999px;background:none;color:var(--muted);display:grid;place-items:center;transition:background .2s,color .2s}
.view-toggle button[aria-pressed="true"]{background:#ffffff26;color:var(--gold-2)}
.view-toggle svg{width:18px;height:18px}
.viewer[data-view="gallery"] .car,.viewer[data-view="gallery"] .press-hint,.viewer[data-view="gallery"] .v-bar,
.viewer[data-view="gallery"] .car-dots,.viewer[data-view="gallery"] .v-actions{display:none}
.viewer:not([data-view="gallery"]) .gal{display:none}
.gal{flex:1;min-height:0;width:100%;overflow-y:auto;overscroll-behavior:contain;padding:4px 18px 32px;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.gal-head{margin:0 0 14px;font-size:12.5px;line-height:1.5;color:var(--muted)}
.gal-head b{color:var(--gold);font-weight:700;font-variant-numeric:tabular-nums}
.gal-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 14px}
@media(min-width:520px){.gal-grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:22px 16px}}

<script>
(() => {
'use strict';
/* ============ data ============ */
// url: 각 카드의 수업 자료 주소를 넣으면 뒷면의 '수업 자료' 버튼이 활성화됩니다.
const CARDS = [
  {id:'001', title:'레고에듀케이션 해커톤\n& 수업사례 발표', cat:'피지컬 AI', url:''},
  {id:'002', title:'디지털센서 AI\n과학에듀톤', cat:'AI 과학', url:''},
  {id:'003', title:'Ethicity 게임', cat:'AI 윤리', url:''},
  {id:'004', title:'경기도온라인학교\nAI동화작가프로젝트', cat:'AI 동화', url:''},
  {id:'005', title:'학교자율시간\nAI 사회정서 수업사례집', cat:'AI 사회정서', url:''},
  {id:'006', title:'AI영상 브루 워크숍', cat:'AI 창작', url:''},
  {id:'007', title:'위툰 워크숍', cat:'AI 웹툰', url:''},
  {id:'008', title:'쌤티나는 바이브코딩', cat:'AI 코딩', url:''},
].map(c => ({...c, img:`assets/cards/${c.id}.webp`, flat:c.title.replace('\n',' ')}));

/* 이머시브 카드 설정
   video : 순서대로 시도할 영상 파일 (없으면 카드 그림으로 임시 연출)
   region: 영상 프레임 안에서 카드 그림이 차지하는 영역(0~1 비율, {x,y,w,h}).
           생략하면 '카드 비율 영역이 프레임 중앙에 꽉 차게' 놓였다고 가정합니다. */
const IMM = {
  // Google Flow(Veo) 8초 720×1280 → H.264 재인코딩. region = 카드 원본과 영상 첫 프레임을 SIFT로 맞춘 값(쿼카 기준).
  '001': { video:'assets/immersive/001.mp4', poster:'assets/immersive/001-poster.webp', w:720, h:1280, rot:2.78, region:{x:-0.1117, y:0.0768, w:1.1444, h:0.8992} },
  '002': { video:'assets/immersive/002.mp4', poster:'assets/immersive/002-poster.webp', w:720, h:1280, rot:-0.92, region:{x:-0.0229, y:0.0095, w:1.0745, h:0.8443} },
  '003': { video:'assets/immersive/003.mp4', poster:'assets/immersive/003-poster.webp', w:720, h:1280, rot:0.62, region:{x:-0.0083, y:-0.0007, w:1.0363, h:0.8142} },
  '004': { video:'assets/immersive/004.mp4', poster:'assets/immersive/004-poster.webp', w:720, h:1280, rot:-0.02, region:{x:-0.1235, y:-0.0018, w:1.2334, h:0.9691} },
  '005': { video:'assets/immersive/005.mp4', poster:'assets/immersive/005-poster.webp', w:720, h:1280, rot:0.64, region:{x:-0.1913, y:0.009, w:1.2392, h:0.9737} },
  '006': { video:'assets/immersive/006.mp4', poster:'assets/immersive/006-poster.webp', w:720, h:1280, rot:1.5, region:{x:-0.0557, y:0.0582, w:1.1463, h:0.9006} },
  '007': { video:'assets/immersive/007.mp4', poster:'assets/immersive/007-poster.webp', w:720, h:1280, rot:1.06, region:{x:-0.0438, y:0.0871, w:1.1073, h:0.87} },
  '008': { video:'assets/immersive/008.mp4', poster:'assets/immersive/008-poster.webp', w:720, h:1280, rot:-0.48, region:{x:-0.0759, y:0.1491, w:1.0961, h:0.8612} },
};
const TOTAL = CARDS.length;
const byId = Object.fromEntries(CARDS.map(c => [c.id, c]));
[...CARDS.map(c => c.img), 'assets/card-back.webp'].forEach(src => { const i = new Image(); i.decoding='async'; i.src = src; });

const $ = s => document.querySelector(s);
if (!document.body.dataset.scene) document.body.dataset.scene = 'home';
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const sleep = ms => new Promise(r => setTimeout(r, ms));
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));

/* ============ storage ============ */
const KEY = 'quoka.scoop.v1';
let save = {owned:{}, opened:0, sound:true};
try { Object.assign(save, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch {}
const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(save)); } catch {} };
const ownedCount = () => CARDS.filter(c => save.owned[c.id]).length;

/* ============ sound (synthesized) ============ */
const sfx = (() => {
  let ctx, master;
  const ok = () => {
    if (!save.sound) return false;
    if (!ctx) { try { ctx = new (window.AudioContext||window.webkitAudioContext)(); master = ctx.createGain(); master.gain.value = .5; master.connect(ctx.destination); } catch { return false; } }
    if (ctx.state === 'suspended') ctx.resume();
    return true;
  };
  const noise = (dur) => { const b = ctx.createBuffer(1, ctx.sampleRate*dur, ctx.sampleRate), d = b.getChannelData(0); for (let i=0;i<d.length;i++) d[i] = Math.random()*2-1; const s = ctx.createBufferSource(); s.buffer = b; return s; };
  const env = (g, t, a, peak, dec) => { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t+a); g.gain.exponentialRampToValueAtTime(0.0001, t+a+dec); };
  const tone = (f, t, dur, type='sine', peak=.2) => { const o = ctx.createOscillator(), g = ctx.createGain(); o.type=type; o.frequency.setValueAtTime(f, t); o.connect(g).connect(master); env(g, t, .008, peak, dur); o.start(t); o.stop(t+dur+.05); };
  return {
    tick(){ if(!ok()) return; const t=ctx.currentTime, s=noise(.05), f=ctx.createBiquadFilter(), g=ctx.createGain(); f.type='bandpass'; f.frequency.value=2500+Math.random()*2500; f.Q.value=1.4; s.connect(f).connect(g).connect(master); env(g,t,.003,.22,.04); s.start(t); },
    rip(){ if(!ok()) return; const t=ctx.currentTime, s=noise(.45), f=ctx.createBiquadFilter(), g=ctx.createGain(); f.type='bandpass'; f.Q.value=.9; f.frequency.setValueAtTime(1800,t); f.frequency.exponentialRampToValueAtTime(6000,t+.3); s.connect(f).connect(g).connect(master); env(g,t,.01,.5,.4); s.start(t); },
    whoosh(d=.5){ if(!ok()) return; const t=ctx.currentTime, s=noise(d), f=ctx.createBiquadFilter(), g=ctx.createGain(); f.type='lowpass'; f.frequency.setValueAtTime(300,t); f.frequency.exponentialRampToValueAtTime(2800,t+d*.6); f.frequency.exponentialRampToValueAtTime(500,t+d); s.connect(f).connect(g).connect(master); env(g,t,d*.4,.32,d*.6); s.start(t); },
    swish(){ if(!ok()) return; const t=ctx.currentTime, s=noise(.18), f=ctx.createBiquadFilter(), g=ctx.createGain(); f.type='highpass'; f.frequency.setValueAtTime(900,t); f.frequency.exponentialRampToValueAtTime(4000,t+.15); s.connect(f).connect(g).connect(master); env(g,t,.02,.18,.15); s.start(t); },
    shimmer(){ if(!ok()) return; const t=ctx.currentTime; [0,4,7,12,16,19].forEach((n,i)=>tone(880*2**(n/12), t+i*.05, .9, 'sine', .07)); },
    chime(i){ if(!ok()) return; const t=ctx.currentTime, base=523.25*2**([0,2,4,5,7,9,11,12][i%8]/12); tone(base,t,.5,'triangle',.12); tone(base*2,t+.03,.35,'sine',.05); },
    fanfare(){ if(!ok()) return; const t=ctx.currentTime; [0,4,7,12].forEach((n,i)=>tone(523.25*2**(n/12), t+i*.09, .7, 'triangle', .13)); tone(1046.5*2**(4/12), t+.4, 1.1, 'sine', .06); },
    tap(){ if(!ok()) return; const t=ctx.currentTime; tone(1400,t,.06,'sine',.06); },
    pad(){ if(!ok()) return null; const t=ctx.currentTime, bus=ctx.createGain(); bus.gain.setValueAtTime(0.0001,t); bus.gain.exponentialRampToValueAtTime(1,t+1.4); bus.connect(master);

    line(x0,x1,y,n=30) { if (reduced) return; for (let i=0;i<n;i++){ const x=x0+(x1-x0)*Math.random(); const max=30+Math.random()*30; parts.push({x,y,vx:(Math.random()-.5)*2,vy:-1-Math.random()*4,drag:.95,grav:.06,life:max,max,r:2+Math.random()*4,rot:0,vr:.1,kind:Math.random()<.5?'star':'dot',c:COLORS[(Math.random()*COLORS.length)|0]}); } },
    confetti(n=90) { if (reduced) return; for (let i=0;i<n;i++){ const max=110+Math.random()*80; parts.push({x:W*Math.random(),y:-20-Math.random()*H*.3,vx:(Math.random()-.5)*2,vy:2+Math.random()*3,drag:.99,grav:.04,life:max,max,r:3+Math.random()*4,rot:Math.random()*6,vr:(Math.random()-.5)*.3,kind:'rect',c:COLORS[(Math.random()*COLORS.length)|0]}); } },

  const capFrom = getComputedStyle(cap).transform;
  cap.animate([{transform:capFrom==='none'?'none':capFrom, opacity:1},{transform:`translate(${dir*L.pw*1.0}px,${-L.pw*.55}px) rotate(${dir*32}deg)`, opacity:0}],
    {duration:reduced?1:620, easing:'cubic-bezier(.2,.7,.3,1)', fill:'forwards'});

    {transform:`translate(${sx}px,${sy - h0*.62}px) scale(${s0})`, offset:.28, easing:'cubic-bezier(.3,.0,.25,1)'},
    {transform:`translate(${sx*.4}px,${sy - h0*.78}px) scale(${s0*1.02})`, offset:.42, easing:'cubic-bezier(.25,.6,.3,1)'},
    {transform:`translate(0px,-14px) scale(1.035)`, offset:.78, easing:'cubic-bezier(.4,0,.2,1)'},

// Long-press: the card sinks and brightens while held, then opens the immersive scene.

// Warm up the video of the card the viewer is looking at (one at a time, after it settles).
let preId = null, preTimer = 0, immStarted = false;
function immPreload(id, delay=700){
  clearTimeout(preTimer);
  const cfg = IMM[id]; if (!cfg || !cfg.video) return;
  preTimer = setTimeout(() => {
    if (immBusy || preId === id) return;
    preId = id; immVid.preload = 'auto'; immVid.muted = true; immVid.src = cfg.video; immVid.load();

// Map the card-art region of a cover-fitted frame onto the card's on-screen rect,
// including the small rotation between the card art and the video's first frame.
function immGeom(fw, fh, region, C, rot=0){
  const VW = innerWidth, VH = innerHeight, s = Math.max(VW/fw, VH/fh), dw = fw*s, dh = fh*s;

  immNote.hidden = hasVid; immLoad.hidden = true;
  const fw = hasVid ? cfg.w : 1061, fh = hasVid ? cfg.h : 1482;
  const G = immGeom(fw, fh, hasVid ? cfg.region : {x:0,y:0,w:1,h:1}, C, hasVid ? (cfg.rot||0) : 0);
  imm.style.setProperty('--fw', G.dw+'px'); imm.style.setProperty('--fh', G.dh+'px');
  // the printed card sits exactly over the source card and dissolves in place
  immCard.src = c.img;
  Object.assign(immCard.style, {left:C.left+'px', top:C.top+'px', width:C.width+'px', height:C.height+'px'});
  imm.classList.add('on'); immUi.classList.remove('show');
  srcEl.style.visibility = 'hidden';

  const from = `translate(${G.tx}px,${G.ty}px) rotate(${G.deg}deg) scale(${G.k})`;
  const to = 'translate(0px,0px) rotate(0deg) scale(1)';
  const rad = C.width*.044;
  const clipFrom = `inset(${C.top}px ${G.VW-C.right}px ${G.VH-C.bottom}px ${C.left}px round ${rad}px)`;
  const clipTo = `inset(0px 0px 0px 0px round 0px)`;
  const D1 = reduced ? 1 : 300, D2 = reduced ? 1 : 1100, ease = 'cubic-bezier(.7,0,.2,1)';
  const pad = hasVid ? null : sfx.pad(); sfx.whoosh(1.2); buzz(15);
  // 1) the card's print dissolves into the aligned first frame while nothing moves
  // 2) then the frame breaks out of the card to full screen
  const anims = [
    immCard.animate([{opacity:1},{opacity:0}], {duration:D1, easing:'ease-in-out', fill:'both'}),
    immMedia.animate([{transform:from},{transform:to}], {duration:D2, delay:D1, easing:ease, fill:'both'}),
    immClip.animate([{clipPath:clipFrom},{clipPath:clipTo}], {duration:D2, delay:D1, easing:ease, fill:'both'}),
    immBack.animate([{opacity:0},{opacity:1}], {duration:D2*.45, delay:D1, fill:'both'}),
    immBg.animate([{opacity:0},{opacity:1}], {duration:D1 + D2*.6, fill:'both'}),
    immVig.animate([{opacity:0},{opacity:1}], {duration:D2, delay:D1, fill:'both'}),
  ];
  await sleep(D1 + D2);
  immUi.classList.add('show');

  const done = new Promise(r => immDone = r);
  const finish = () => immDone && immDone();
  let camAnim = null, sparkle = null, loadTimer = 0, giveUp = 0;
  const stillCam = (D) => {
    camAnim = immCam.animate([{transform:'none'},{transform:'scale(1.16) translate(1.5%,1%) rotate(-.6deg)', offset:.55},{transform:'scale(1.28) translate(-1%,2.5%) rotate(.4deg)'}], {duration:D, easing:'cubic-bezier(.45,0,.4,1)', fill:'both'});
    anims.push(immLight.animate([{opacity:0},{opacity:1, offset:.3},{opacity:.5, offset:.7},{opacity:1}], {duration:D, fill:'both'}));
    sparkle = setInterval(() => fx.burst(innerWidth*(.15+Math.random()*.7), innerHeight*(.15+Math.random()*.6), 6, 2.5, {r:6, grav:-.02}), 380);
    setTimeout(finish, D);
  };
  if (hasVid) {
    immStarted = true;
    let playing = false;
    immVid.onplaying = () => { playing = true; immVid.style.opacity = 1; immLoad.hidden = true; clearTimeout(loadTimer); clearTimeout(giveUp); };
    immVid.onwaiting = () => { playing = false; clearTimeout(loadTimer); loadTimer = setTimeout(() => { if (immBusy && !playing) immLoad.hidden = false; }, 500); };
    immVid.onended = finish;
    immVid.onerror = () => { immLoad.hidden = true; if (!camAnim) stillCam(reduced ? 1 : 5000); };
    loadTimer = setTimeout(() => { if (!playing) immLoad.hidden = false; }, 600);
    giveUp = setTimeout(() => { if (immVid.paused) { immLoad.hidden = true; if (!camAnim) stillCam(reduced ? 1 : 5000); } }, 15000);
    try { immVid.currentTime = 0; } catch {}
    immVid.muted = !save.sound; immVid.volume = .85;
    immVid.play().catch(() => { immVid.muted = true; return immVid.play(); }).catch(() => {});
  } else {
    stillCam(reduced ? 1 : 6200);
  }
  await done; immDone = null; immStarted = false;
  clearInterval(sparkle); clearTimeout(loadTimer); clearTimeout(giveUp); immLoad.hidden = true;
  immVid.onplaying = immVid.onwaiting = immVid.onended = immVid.onerror = null;

  // close: 1) dissolve back to the first frame (it lines up with the card)
  //        2) pull that frame back into the card  3) the card's print returns in place
  immUi.classList.remove('show'); pad && pad.stop(); sfx.whoosh(.8);
  const X1 = reduced ? 1 : 340, X2 = reduced ? 1 : 1000, X3 = reduced ? 1 : 280;
  const pre = [ immLight.animate([{opacity:getComputedStyle(immLight).opacity},{opacity:0}], {duration:X1, fill:'both'}) ];
  if (hasVid) pre.push(immVid.animate([{opacity:getComputedStyle(immVid).opacity},{opacity:0}], {duration:X1, easing:'ease-in-out', fill:'both'}));
  if (camAnim) pre.push(immCam.animate([{transform:getComputedStyle(immCam).transform},{transform:'none'}], {duration:X1, easing:'ease-in-out', fill:'both'}));
  await sleep(X1);
  if (hasVid) immVid.pause();
  const back = [
    immMedia.animate([{transform:to},{transform:from}], {duration:X2, easing:ease, fill:'both'}),
    immClip.animate([{clipPath:clipTo},{clipPath:clipFrom}], {duration:X2, easing:ease, fill:'both'}),
    immBack.animate([{opacity:1},{opacity:1, offset:.4},{opacity:0}], {duration:X2, fill:'both'}),
    immBg.animate([{opacity:1},{opacity:1, offset:.35},{opacity:0}], {duration:X2 + X3, fill:'both'}),
    immVig.animate([{opacity:1},{opacity:0}], {duration:X2, fill:'both'}),
    immCard.animate([{opacity:0},{opacity:1}], {duration:X3, delay:X2, easing:'ease-in-out', fill:'both'}),
  ];
  await sleep(X2 + X3);
  srcEl.style.visibility = '';
  imm.classList.remove('on');
  [...anims, ...pre, ...back, camAnim].forEach(a => a && a.cancel());
  if (hasVid) { immVid.style.opacity = 0; try { immVid.currentTime = 0; } catch {} }
  immBusy = false;
}
imm.addEventListener('pointerup', () => { if (immDone && immUi.classList.contains('show')) immDone(); });
// iOS only lets a video play with sound from inside a touch release. The long-press fires before
// the finger lifts, so unlock (or unmute) the video on that release.
addEventListener('pointerup', () => {
  if (!immBusy || !save.sound || immVid.style.display === 'none') return;
  if (immStarted) { if (immVid.muted) immVid.muted = false; return; }
  immVid.muted = false;
  const p = immVid.play();
  if (p) p.then(() => { if (!immStarted) { immVid.pause(); try { immVid.currentTime = 0; } catch {} } }, () => { immVid.muted = true; });
}, true);
addEventListener('keydown', e => { if (immBusy && (e.key==='Escape'||e.key===' '||e.key==='Enter') && immDone) { e.preventDefault(); e.stopImmediatePropagation(); immDone(); } }, true);

/* debug hooks for automated checks */
window.__quoka = {openPack, IMM, playImmersive:id => playImmersive(byId[id], document.querySelector(`#deck .card[data-id="${id}"]`)), state:() => ({scene:document.body.dataset.scene, top, save, immBusy})};
})();
</script>
